[project]
name = "werewolf-captions"
version = "0.1.0"
description = "AI captions + translation worker for Werewolf Online voice chat"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "livekit>=1.3.0",
  "faster-whisper>=1.2.1",
  "ctranslate2>=4.6.0",
  "sentencepiece>=0.2.1",
  "httpx>=0.28.1",
  "numpy>=2.0",
  "huggingface-hub>=0.30",
]

[project.scripts]
werewolf-captions = "werewolf_captions.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/werewolf_captions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["SIM108"]

[tool.ruff.format]
quote-style = "single"
